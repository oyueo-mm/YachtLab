name: YachtLab SOTA candidate independent large-sample confirmation
on:
  pull_request:
    paths:
      - scripts/summarize-sota-confirm.mjs
      - .github/workflows/sota-independent-confirm.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: yachtlab-sota-independent-confirm-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Syntax and public-state exact BR regression tests
        run: |
          node --check scripts/summarize-sota-confirm.mjs
          npm test -- --reporter=dot
  duel:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      max-parallel: 5
      fail-fast: false
      matrix:
        include:
          - candidate: calibrated-v3
            opponent: Win DP v2
            pairs: 1000
          - candidate: dp-guided-mcts
            opponent: Win DP v2
            pairs: 1000
          - candidate: conditional-br-v21
            opponent: Win DP v2
            pairs: 2000
          - candidate: calibrated-v3
            opponent: DP Expert
            pairs: 500
          - candidate: conditional-br-v21
            opponent: DP Expert
            pairs: 500
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fresh held-out 12-category full games with swapped seats
        run: node scripts/sota-attack-benchmark.mjs --candidate "${{ matrix.candidate }}" --opponent "${{ matrix.opponent }}" --shard 2 --pairs ${{ matrix.pairs }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sota-confirm-${{ matrix.candidate }}-${{ matrix.opponent }}
          path: training/results/sota-challenge/*-2.json
          retention-days: 90
          if-no-files-found: warn
  summarize:
    needs: duel
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # push ONLY the automation/research-* branch
      pull-requests: write # open / update the research report PR
      actions: write # start deploy.yml so the required ci-result exists on that PR (also reads artifacts)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: sota-confirm-*
          path: training/results/sota-challenge
          merge-multiple: true
      - run: node scripts/summarize-sota-confirm.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: sota-independent-confirmation-report
          path: |
            training/results/sota-challenge/independent-confirmation.json
            docs/context/_generated/SOTA-CONFIRM-LATEST.md
          retention-days: 90
      - name: Commit research-only report
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          node scripts/ci/publish-generated.mjs publish \
            --branch automation/research-sota-independent-confirm \
            --allow "docs/context/_generated/SOTA-CONFIRM-LATEST.md" \
            --scope-to-allow --preserve-history \
            --title "chore(research): publish independently seeded competitive policy confirmation" \
            --note "연구 워크플로가 생성한 보고서입니다. 알고리즘·실험 설정·시드·결과는 바꾸지 않고 문서만 추가/갱신합니다. 원본 실행과 아티팩트: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Start the required CI on the research report PR
        if: steps.publish.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.publish.outputs.head_sha }}
        run: node scripts/ci/publish-generated.mjs ensure-ci --branch automation/research-sota-independent-confirm --sha "$HEAD_SHA" --workflow deploy.yml
