name: Tabular RL algorithm zoo — last-turn Choice
on:
  pull_request:
    paths:
      - "training/tabular_choice_zoo.py"
      - ".github/workflows/tabular-zoo.yml"
  push:
    branches: [main]
    paths:
      - "training/tabular_choice_zoo.py"
      - ".github/workflows/tabular-zoo.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tabular:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up lightweight tabular research
        run: python -m pip install numpy
      - name: Eight-algorithm smoke test
        if: github.event_name == 'pull_request'
        run: python training/tabular_choice_zoo.py --smoke
      - name: Train eight tabular learners for 250,000 episodes each, evaluate 10,000 held-out games
        if: github.event_name != 'pull_request'
        run: python training/tabular_choice_zoo.py --episodes 250000 --eval 10000 --seed 28111
      - name: Archive scorecard and compact learned Q-tables
        uses: actions/upload-artifact@v4
        with:
          name: tabular-rl-choice-zoo
          path: |
            training/results/tabular-choice-zoo.json
            training/checkpoints/tabular-choice-zoo/*.npz
          retention-days: 90
