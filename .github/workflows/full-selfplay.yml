name: Full-game self-play and three-turn competitive research
on:
  pull_request:
    paths:
      - "src/selfplay-residual.ts"
      - "src/competitive-v3.ts"
      - "tests/selfplay.test.ts"
      - "scripts/train-selfplay.mjs"
      - "scripts/calibrate-opponents.mjs"
      - "scripts/bench-v3.mjs"
      - "docs/context/SELFPLAY-RESEARCH.md"
      - ".github/workflows/full-selfplay.yml"
  push:
    branches: [main]
    paths:
      - "src/selfplay-residual.ts"
      - "src/competitive-v3.ts"
      - "scripts/train-selfplay.mjs"
      - "scripts/calibrate-opponents.mjs"
      - "scripts/bench-v3.mjs"
      - ".github/workflows/full-selfplay.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: yachtlab-full-selfplay-${{ github.ref }}
  cancel-in-progress: false
jobs:
  selfplay:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: write # push ONLY the automation/research-* branch
      pull-requests: write # open / update the research report PR
      actions: write # start deploy.yml so the required ci-result exists on that PR (also reads artifacts)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 40
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate full game self-play research script
        run: node --check scripts/train-selfplay.mjs
      - name: Smoke train against current and historical snapshots
        if: github.event_name == 'pull_request'
        run: node scripts/train-selfplay.mjs --smoke
      - name: Actual full-game population evolution, REINFORCE self-play and independent matches
        if: github.event_name != 'pull_request'
        run: node scripts/train-selfplay.mjs
      - name: Preserve learned weights, training and per-game evaluation
        uses: actions/upload-artifact@v4
        with:
          name: yachtlab-full-game-selfplay-research
          path: |
            training/results/full-selfplay-research.json
            training/checkpoints/full-selfplay-selected.json
            docs/context/_generated/SELFPLAY-LATEST.md
          retention-days: 90
      - name: Record experiment summary in persistent GitHub context
        id: publish
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          node scripts/ci/publish-generated.mjs publish \
            --branch automation/research-full-selfplay \
            --allow "docs/context/_generated/SELFPLAY-LATEST.md" \
            --scope-to-allow --preserve-history \
            --title "chore(context): record full-game self-play experiment" \
            --note "연구 워크플로가 생성한 보고서입니다. 알고리즘·실험 설정·시드·결과는 바꾸지 않고 문서만 추가/갱신합니다. 원본 실행과 아티팩트: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Start the required CI on the research report PR
        if: github.event_name != 'pull_request' && steps.publish.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.publish.outputs.head_sha }}
        run: node scripts/ci/publish-generated.mjs ensure-ci --branch automation/research-full-selfplay --sha "$HEAD_SHA" --workflow deploy.yml
  three_turn:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check opponent calibration and 3-category solver harness syntax
        run: |
          node --check scripts/calibrate-opponents.mjs
          node --check scripts/bench-v3.mjs
      - name: Calibrate opponent score forecast with separate training and test seeds
        run: node scripts/calibrate-opponents.mjs ${{ github.event_name == 'pull_request' && '--smoke' || '' }}
      - name: Test exact own-three-turn DP under the forecast and paired matches
        run: node scripts/bench-v3.mjs ${{ github.event_name == 'pull_request' && '--smoke' || '' }}
      - name: Preserve opponent forecast and paired v3 benchmark
        uses: actions/upload-artifact@v4
        with:
          name: yachtlab-three-turn-distributional-study
          path: |
            training/results/opponent-calibration.json
            benchmarks/research/win-v3-calibration-study.json
          retention-days: 90
