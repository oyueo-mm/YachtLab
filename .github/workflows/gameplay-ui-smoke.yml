name: YachtLab gameplay UI targeted smoke
on:
  pull_request:
    paths:
      - src/ai.ts
      - src/worker.ts
      - src/match.ts
      - src/Dice.tsx
      - src/Scoreboard.tsx
      - src/MultiScoreboard.tsx
      - src/AlgorithmDropdown.tsx
      - src/styles.css
      - tests/ui/game-ux.spec.ts
      - .github/workflows/gameplay-ui-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: TypeScript and Vite build
        run: npm run build
      - run: npx playwright install --only-shell chromium
      - name: New player-facing UI and frozen v4-D runtime in desktop and mobile browsers
        run: |
          npm run preview -- --port 5173 > /tmp/yachtlab-vite.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5173/YachtLab/ >/dev/null && break; sleep 1; done
          npx playwright test tests/ui/game-ux.spec.ts tests/ui/v04.spec.ts --workers=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: targeted-ui-failures
          path: test-results
