name: Integrated competitive AI research
on:
  pull_request:
    paths:
      - "src/competitive-v2.ts"
      - "src/research-guided-mcts.ts"
      - "scripts/research-league.mjs"
      - "training/qr_dqn_choice.py"
      - ".github/workflows/integrated-research.yml"
  push:
    branches: [main]
    paths:
      - "src/competitive-v2.ts"
      - "src/research-guided-mcts.ts"
      - "scripts/research-league.mjs"
      - "training/qr_dqn_choice.py"
      - ".github/workflows/integrated-research.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  league:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Smoke check research agents on PR
        if: github.event_name == 'pull_request'
        run: node scripts/research-league.mjs --smoke
      - name: Complete paired league and held-out hybrid validation
        if: github.event_name != 'pull_request'
        run: node scripts/research-league.mjs
      - name: Upload raw independent league results
        uses: actions/upload-artifact@v4
        with:
          name: yachtlab-competitive-league
          path: benchmarks/research/competitive-v2-league.json
          retention-days: 90
  qr_dqn:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax validation on PR
        if: github.event_name == 'pull_request'
        run: python -m py_compile training/qr_dqn_choice.py
      - name: Install CPU-only PyTorch and numpy
        if: github.event_name != 'pull_request'
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Train and evaluate QR-DQN on Choice-only stochastic endgame
        if: github.event_name != 'pull_request'
        run: python training/qr_dqn_choice.py --episodes 6000 --eval 3000 --seed 26020
      - name: Preserve learned weights and unbiased evaluation
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: yachtlab-qr-dqn-choice-pilot
          path: |
            training/results/qr-dqn-choice.json
            training/checkpoints/qr-dqn-choice.pt
          retention-days: 90
