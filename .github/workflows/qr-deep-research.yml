name: YachtLab QR-DQN and IQN deep research
on:
  pull_request:
    paths:
      - "src/qr-extensions.ts"
      - "scripts/research-qr-suite.mjs"
      - "scripts/summarize-qr-suite.mjs"
      - "tests/qr-extensions.test.ts"
      - ".github/workflows/qr-deep-research.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: yachtlab-qr-deep-research-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Static checks and complete unit tests
        run: |
          npm test -- --reporter=dot
          npm run build
          node --check scripts/research-qr-suite.mjs
          node --check scripts/summarize-qr-suite.mjs
          node --check scripts/train-qr-factorial.mjs
          node --check scripts/summarize-qr-factorial.mjs
      - name: Real full-game end-to-end smoke
        run: |
          for group in baseline grid0 grid1 grid2 grid3 grid4 grid5 improvements iqn; do
            node scripts/research-qr-suite.mjs --smoke --group "$group" --seed-index 0
          done
          for cfg in control lr02 target250 perIS noDouble loss6 unrestricted wide32 rich32 richStable; do
            node scripts/train-qr-factorial.mjs --config "$cfg" --seed-index 0 --smoke
          done
  full-research:
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        group: [baseline, grid0, grid1, grid2, grid3, grid4, grid5, improvements, iqn]
        seed: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Train and validate independent full-game policies
        run: node scripts/research-qr-suite.mjs --group ${{ matrix.group }} --seed-index ${{ matrix.seed }}
      - name: Preserve all trained models, seeds, games and counterfactual evidence
        uses: actions/upload-artifact@v4
        with:
          name: qr-suite-${{ matrix.group }}-seed-${{ matrix.seed }}
          path: training/results/qr-suite/*.json
          retention-days: 90
  aggregate:
    needs: full-research
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # push ONLY the automation/research-* branch
      pull-requests: write # open / update the research report PR
      actions: write # start deploy.yml so the required ci-result exists on that PR (also reads artifacts)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: qr-suite-*
          merge-multiple: true
          path: training/results/qr-suite
      - name: Aggregate five-seed controlled ablations without confirmation-based selection
        run: node scripts/summarize-qr-suite.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: qr-suite-all-results
          path: |
            docs/context/_generated/QR-SUITE-LATEST.md
            training/results/qr-suite-summary.json
          retention-days: 90
      - name: Permanently save the completed experiment summary
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          node scripts/ci/publish-generated.mjs publish \
            --branch automation/research-qr-deep-research \
            --allow "docs/context/_generated/QR-SUITE-LATEST.md" \
            --scope-to-allow --preserve-history \
            --title "chore(context): record complete QR/IQN five-seed ablations" \
            --note "연구 워크플로가 생성한 보고서입니다. 알고리즘·실험 설정·시드·결과는 바꾸지 않고 문서만 추가/갱신합니다. 원본 실행과 아티팩트: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Start the required CI on the research report PR
        if: steps.publish.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.publish.outputs.head_sha }}
        run: node scripts/ci/publish-generated.mjs ensure-ci --branch automation/research-qr-deep-research --sha "$HEAD_SHA" --workflow deploy.yml
