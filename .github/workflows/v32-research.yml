name: YachtLab v3.2 exact three-slot opponent forecast research
on:
  pull_request:
    paths:
      - src/research-exact-three-score.ts
      - src/research-v32.ts
      - src/competitive-v3.ts
      - tests/research-v32.test.ts
      - scripts/bench-v32.mjs
      - scripts/summarize-v32.mjs
      - .github/workflows/v32-research.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: yachtlab-v32-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Bellman expectation normalization, policy legality, RNG invariance
        run: npm test -- --reporter=dot
      - run: npm run build
      - run: |
          node --check scripts/bench-v32.mjs
          node --check scripts/summarize-v32.mjs
      - name: Complete two seed pairs with exact PMF v3.2
        run: node scripts/bench-v32.mjs --candidate v32-exact3 --opponent "DP Expert" --shard 1200 --smoke
  duel:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        candidate: [v32-exact3, v3-unmodified]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fresh 300 independent seat-paired seeds for small pilot
        run: node scripts/bench-v32.mjs --candidate "${{ matrix.candidate }}" --opponent "DP Expert" --shard 1201 --pairs 300
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v32-pilot-${{ matrix.candidate }}
          path: training/results/v32-challenge/*.json
          retention-days: 90
          if-no-files-found: error
  report:
    needs: duel
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # push ONLY the automation/research-* branch
      pull-requests: write # open / update the research report PR
      actions: write # start deploy.yml so the required ci-result exists on that PR (also reads artifacts)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: v32-pilot-*
          path: training/results/v32-challenge
          merge-multiple: true
      - run: node scripts/summarize-v32.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: v32-pilot-independent-summary
          path: |
            training/results/v32-challenge/summary.json
            docs/context/_generated/V32-LATEST.md
          retention-days: 90
      - name: Publish research report only
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          node scripts/ci/publish-generated.mjs publish \
            --branch automation/research-v32-research \
            --allow "docs/context/_generated/V32-LATEST.md" \
            --scope-to-allow --preserve-history \
            --title "chore(research): publish Win DP v3.2 exact-forecast pilot" \
            --note "연구 워크플로가 생성한 보고서입니다. 알고리즘·실험 설정·시드·결과는 바꾸지 않고 문서만 추가/갱신합니다. 원본 실행과 아티팩트: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Start the required CI on the research report PR
        if: steps.publish.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.publish.outputs.head_sha }}
        run: node scripts/ci/publish-generated.mjs ensure-ci --branch automation/research-v32-research --sha "$HEAD_SHA" --workflow deploy.yml
