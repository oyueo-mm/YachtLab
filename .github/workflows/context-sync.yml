name: Context sync
# CI-1: generated context docs reach main ONLY through one automation pull request (automation/context-sync),
# never by a direct push, so branch protection on main can be switched on without breaking this workflow.
#   push to main / daily schedule / manual → regenerate → (changed?) → update the single PR → start the real CI on it
#   GitHub Wiki mirroring is its own workflow (context-wiki.yml) and runs when the snapshot is MERGED on main.
# See docs/operations/CI-1-CONTEXT-SYNC-PROTECTION.md for permissions, the one admin setting this needs,
# loop/duplicate protection and recovery.
on:
  push:
    branches: [main]
    # A merged snapshot PR changes only these files: it must not start another sync (loop protection).
    paths-ignore:
      - "docs/context/_generated/**"
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: "Automation branch to write (must start with automation/). Leave the default except for tests."
        type: string
        default: "automation/context-sync"
      run_ci:
        description: "Start the required CI (deploy.yml) on the automation branch"
        type: boolean
        default: true
  pull_request:
    paths:
      - "docs/context/**"
      - "scripts/update-context.mjs"
      - "scripts/prepare-context-wiki.mjs"
      - "scripts/ci/publish-generated.mjs"
      - "scripts/ci/sync-wiki.mjs"
      - ".github/workflows/context-sync.yml"
      - ".github/workflows/context-wiki.yml"
      - "src/ai.ts"
      - "src/engine.ts"
permissions:
  contents: read
concurrency:
  # One writer for the automation branch at a time; a queued run is replaced by the newest, which regenerates from the latest main.
  group: context-sync-automation
  cancel-in-progress: false
jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 80
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate context snapshot generator
        run: |
          node --check scripts/update-context.mjs
          node --check scripts/prepare-context-wiki.mjs
          node --check scripts/ci/publish-generated.mjs
          node --check scripts/ci/sync-wiki.mjs
          node scripts/update-context.mjs --check
          node scripts/update-context.mjs --write
          node scripts/prepare-context-wiki.mjs /tmp/yachtlab-context-wiki-preview
          test -s /tmp/yachtlab-context-wiki-preview/Home.md
          test -s docs/context/_generated/CURRENT_STATE.md
          test -s docs/context/_generated/manifest.json
  sync:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # push ONLY the automation/* branch (the script refuses any other branch)
      pull-requests: write # open / edit / close the single automation PR
      actions: write # start deploy.yml (workflow_dispatch) so the required ci-result check exists on the PR head
    env:
      AUTOMATION_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || 'automation/context-sync' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # push / schedule: the latest main. Manual: the ref the operator selected (lets a change to this workflow be tried).
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || 'main' }}
          fetch-depth: 80
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate truthful context from repository and CI status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-context.mjs --write
      - name: Propose changed generated context through the automation PR
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          # On push only the cheap-to-ignore per-commit fields would change on nearly every merge; refresh those on the
          # daily/manual run, but always rebase an already open PR so it stays current with main.
          extra=""
          if [ "$EVENT" = "push" ]; then extra="--skip-volatile-only"; fi
          node scripts/ci/publish-generated.mjs publish \
            --branch "$AUTOMATION_BRANCH" \
            --allow docs/context/_generated/ \
            --title "chore(context): refresh repository snapshot" \
            --note "GitHub Actions가 코드·Git 기록에서 다시 생성한 맥락 문서입니다. 사람이 쓴 문서는 포함되지 않습니다." \
            --volatile-json docs/context/_generated/manifest.json \
            --volatile-keys recentSourceCommits,recentWorkflowRuns,workflowQuery \
            --derived docs/context/_generated/CURRENT_STATE.md \
            $extra
      - name: Start the required CI on the automation branch
        if: steps.publish.outputs.head_sha != '' && (github.event_name != 'workflow_dispatch' || inputs.run_ci)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.publish.outputs.head_sha }}
          EVENT: ${{ github.event_name }}
        run: |
          extra=""
          if [ "$EVENT" = "workflow_dispatch" ]; then extra="--force-redispatch"; fi
          node scripts/ci/publish-generated.mjs ensure-ci --branch "$AUTOMATION_BRANCH" --sha "$HEAD_SHA" --workflow deploy.yml $extra
