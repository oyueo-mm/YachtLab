name: YachtLab independent discovered Yacht AI forensic evaluation
on:
  pull_request:
    paths:
      - src/discovered-external.ts
      - tests/discovered-external.test.ts
      - scripts/benchmark-discovered-external.mjs
      - scripts/summarize-discovered-external.mjs
      - .github/workflows/discovered-external.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: yachtlab-discovered-external-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit tests, strict TypeScript build and node syntax
        run: |
          npm test -- --reporter=dot
          npm run build
          node --check scripts/benchmark-discovered-external.mjs
          node --check scripts/summarize-discovered-external.mjs
      - name: One fully instrumented complete 12-category match per model
        run: |
          node scripts/benchmark-discovered-external.mjs --model Z7DartHard12 --shard 0 --smoke
          node scripts/benchmark-discovered-external.mjs --model Z7DartMedium12 --shard 0 --smoke
  duel:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        model: [Z7DartHard12, Z7DartMedium12]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 40 paired public dice seeds and game-stage loss attribution
        run: node scripts/benchmark-discovered-external.mjs --model ${{ matrix.model }} --shard ${{ matrix.shard }} --pairs 40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovered-duel-${{ matrix.model }}-${{ matrix.shard }}
          path: training/results/new-external-research/${{ matrix.model }}-shard-${{ matrix.shard }}.json
          retention-days: 90
          if-no-files-found: warn
  summarize:
    needs: duel
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # push ONLY the automation/research-* branch
      pull-requests: write # open / update the research report PR
      actions: write # start deploy.yml so the required ci-result exists on that PR (also reads artifacts)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: discovered-duel-*
          path: training/results/new-external-research
          merge-multiple: true
      - name: Validate every pair and generate measured failure taxonomy
        run: node scripts/summarize-discovered-external.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: discovered-external-final-report
          path: |
            docs/context/_generated/NEW-EXTERNAL-RESEARCH-LATEST.md
            training/results/new-external-research/final-summary.json
          retention-days: 90
      - name: Publish research report only
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          node scripts/ci/publish-generated.mjs publish \
            --branch automation/research-discovered-external \
            --allow "docs/context/_generated/NEW-EXTERNAL-RESEARCH-LATEST.md" \
            --scope-to-allow --preserve-history \
            --title "chore(research): publish discovered Yacht source adversaries' loss analysis" \
            --note "연구 워크플로가 생성한 보고서입니다. 알고리즘·실험 설정·시드·결과는 바꾸지 않고 문서만 추가/갱신합니다. 원본 실행과 아티팩트: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Start the required CI on the research report PR
        if: steps.publish.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.publish.outputs.head_sha }}
        run: node scripts/ci/publish-generated.mjs ensure-ci --branch automation/research-discovered-external --sha "$HEAD_SHA" --workflow deploy.yml
