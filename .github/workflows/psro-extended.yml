name: PSRO oracle audit, scorecard conditional PMF and multi-seed large PPO
on:
  pull_request:
    paths:
      - "src/conditional-score-pmf.ts"
      - "src/competitive-v3.ts"
      - "scripts/audit-psro-oracles.mjs"
      - "scripts/research-scorecard-pmf.mjs"
      - "scripts/train-ppo-multiseed.mjs"
      - "scripts/summarize-ppo-multiseed.mjs"
      - "tests/conditional-score-pmf.test.ts"
      - ".github/workflows/psro-extended.yml"
  push:
    branches: [main]
    paths:
      - "src/conditional-score-pmf.ts"
      - "src/competitive-v3.ts"
      - "scripts/audit-psro-oracles.mjs"
      - "scripts/research-scorecard-pmf.mjs"
      - "scripts/train-ppo-multiseed.mjs"
      - "scripts/summarize-ppo-multiseed.mjs"
      - ".github/workflows/psro-extended.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: yachtlab-extended-psro-ppo-${{ github.ref }}
  cancel-in-progress: false
jobs:
  psro-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Full unit tests and reproducibility of oracle harness
        run: |
          npm test -- --reporter=dot
          node --check scripts/audit-psro-oracles.mjs
      - name: Build genuine empirical metagame and learn approximate responses
        run: node scripts/research-psro.mjs ${{ github.event_name == 'pull_request' && '--smoke' || '' }}
      - name: Evaluate every response oracle against frozen historical meta mix with independent seeds
        run: node scripts/audit-psro-oracles.mjs ${{ github.event_name == 'pull_request' && '--smoke' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: psro-oracle-expanded
          path: |
            training/results/psro-population.json
            training/results/psro-real-matrix.json
            training/results/psro-oracle-audit.json
            docs/context/_generated/PSRO-ORACLE-AUDIT.md
          retention-days: 90
  scorecard-pmf:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test conditional scorecard PMF and log/CRPS calculations
        run: |
          npm test -- --reporter=dot
          node --check scripts/research-scorecard-pmf.mjs
      - name: Fit mask/upper/score-conditioned empirical PMF on three disjoint data splits
        run: node scripts/research-scorecard-pmf.mjs ${{ github.event_name == 'pull_request' && '--smoke' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: scorecard-conditional-pmf
          path: |
            training/results/scorecard-conditional-pmf.json
            docs/context/_generated/SCORECARD-PMF-LATEST.md
          retention-days: 90
  ppo:
    needs: psro-oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        seed: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Reuse fixed, separately produced empirical PSRO population
        uses: actions/download-artifact@v4
        with:
          name: psro-oracle-expanded
          path: .
      - name: Check PPO experiment syntax
        run: node --check scripts/train-ppo-multiseed.mjs
      - name: Train two PPO variants (8192 full games each) with independent initialization
        run: node scripts/train-ppo-multiseed.mjs --seed-index ${{ matrix.seed }} ${{ github.event_name == 'pull_request' && '--smoke' || '' }}
      - name: Save all model weights, full-game raw matches and untouched seed confirmation
        uses: actions/upload-artifact@v4
        with:
          name: ppo-large-seed-${{ matrix.seed }}
          path: |
            training/results/ppo-multiseed-${{ matrix.seed }}.json
            training/checkpoints/ppo-multiseed-${{ matrix.seed }}.json
            docs/context/_generated/PPO-MULTISEED-${{ matrix.seed }}.md
          retention-days: 90
  aggregate:
    needs: [ppo, scorecard-pmf]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # push ONLY the automation/research-* branch
      pull-requests: write # open / update the research report PR
      actions: write # start deploy.yml so the required ci-result exists on that PR (also reads artifacts)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: psro-oracle-expanded
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: scorecard-conditional-pmf
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: ppo-large-seed-*
          merge-multiple: true
          path: .
      - name: Aggregate independent PPO seeds without selecting by confirmation result
        run: node scripts/summarize-ppo-multiseed.mjs
      - name: Save multi-seed independent confirmation and uncertainty audit
        uses: actions/upload-artifact@v4
        with:
          name: ppo-multiseed-consolidated
          path: |
            training/results/ppo-multiseed-summary.json
            docs/context/_generated/PPO-MULTISEED-LATEST.md
          retention-days: 90
      - name: Commit reproducible outcome to permanent GitHub context hub
        id: publish
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          node scripts/ci/publish-generated.mjs publish \
            --branch automation/research-psro-extended \
            --allow "docs/context/_generated/PSRO-ORACLE-AUDIT.md" \
            --allow "docs/context/_generated/SCORECARD-PMF-LATEST.md" \
            --allow "docs/context/_generated/PPO-MULTISEED-0.md" \
            --allow "docs/context/_generated/PPO-MULTISEED-1.md" \
            --allow "docs/context/_generated/PPO-MULTISEED-2.md" \
            --allow "docs/context/_generated/PPO-MULTISEED-LATEST.md" \
            --scope-to-allow --preserve-history \
            --title "chore(context): record oracle, scorecard PMF and three PPO seeds" \
            --note "연구 워크플로가 생성한 보고서입니다. 알고리즘·실험 설정·시드·결과는 바꾸지 않고 문서만 추가/갱신합니다. 원본 실행과 아티팩트: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Start the required CI on the research report PR
        if: github.event_name != 'pull_request' && steps.publish.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.publish.outputs.head_sha }}
        run: node scripts/ci/publish-generated.mjs ensure-ci --branch automation/research-psro-extended --sha "$HEAD_SHA" --workflow deploy.yml
