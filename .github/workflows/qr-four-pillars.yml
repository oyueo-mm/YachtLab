name: YachtLab QR four-pillar research
on:
  pull_request:
    paths:
      - "src/qr-extensions.ts"
      - "src/qr-safety-gate.ts"
      - "scripts/train-qr-factorial.mjs"
      - "scripts/summarize-qr-factorial.mjs"
      - "tests/qr-factorial-gate.test.ts"
      - ".github/workflows/qr-four-pillars.yml"
  push:
    branches: [main]
    paths:
      - "src/qr-extensions.ts"
      - "src/qr-safety-gate.ts"
      - "scripts/train-qr-factorial.mjs"
      - "scripts/summarize-qr-factorial.mjs"
      - "tests/qr-factorial-gate.test.ts"
      - ".github/workflows/qr-four-pillars.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qr-four-pillars-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Full regression tests, Vite build, Node syntax checks
        run: |
          npm test -- --reporter=dot
          npm run build
          node --check scripts/train-qr-factorial.mjs
          node --check scripts/summarize-qr-factorial.mjs
      - name: "Actual 12-round end-to-end smoke: every isolated research factor and safety gate"
        run: |
          for cfg in control lr02 target250 perIS noDouble loss6 unrestricted wide32 rich32 richStable; do
            node scripts/train-qr-factorial.mjs --config "$cfg" --seed-index 0 --smoke
          done
  train-factorial:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        config: [control, lr02, target250, perIS, noDouble, loss6, unrestricted, wide32, rich32, richStable]
        seed: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Train and evaluate predeclared QR variant on independent game seeds
        run: node scripts/train-qr-factorial.mjs --config ${{ matrix.config }} --seed-index ${{ matrix.seed }}
      - name: Save per-seed training, all final paired games, rollout decisions and weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qr-factorial-results-${{ matrix.config }}-${{ matrix.seed }}
          path: training/results/qr-factorial/*.json
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve intermediate weights even after interrupted training
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qr-factorial-checkpoints-${{ matrix.config }}-${{ matrix.seed }}
          path: training/checkpoints/qr-factorial/*.json
          if-no-files-found: warn
          retention-days: 90
  consolidate:
    needs: train-factorial
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # push ONLY the automation/research-* branch
      pull-requests: write # open / update the research report PR
      actions: write # start deploy.yml so the required ci-result exists on that PR (also reads artifacts)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: qr-factorial-results-*
          merge-multiple: true
          path: training/results/qr-factorial
      - name: Consolidate 50 seed/config records without confirmation-based model selection
        run: node scripts/summarize-qr-factorial.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: qr-four-pillars-study-summary
          path: |
            docs/context/_generated/QR-FOUR-PILLARS-LATEST.md
            training/results/qr-factorial-summary.json
          retention-days: 90
      - name: Permanently save study report without activating experimental AI
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          node scripts/ci/publish-generated.mjs publish \
            --branch automation/research-qr-four-pillars \
            --allow "docs/context/_generated/QR-FOUR-PILLARS-LATEST.md" \
            --scope-to-allow --preserve-history \
            --title "chore(context): four-pillar QR study results" \
            --note "연구 워크플로가 생성한 보고서입니다. 알고리즘·실험 설정·시드·결과는 바꾸지 않고 문서만 추가/갱신합니다. 원본 실행과 아티팩트: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Start the required CI on the research report PR
        if: steps.publish.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.publish.outputs.head_sha }}
        run: node scripts/ci/publish-generated.mjs ensure-ci --branch automation/research-qr-four-pillars --sha "$HEAD_SHA" --workflow deploy.yml
