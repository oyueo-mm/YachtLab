name: Confirm Win DP v2 and long QR-DQN on fresh seeds
on:
  push:
    branches: [main]
    paths:
      - "scripts/confirm-v2.mjs"
      - ".github/workflows/confirm-v2.yml"
  workflow_dispatch:
    inputs:
      games:
        description: "Even number of primary Win DP v2 versus DP Expert games"
        required: true
        default: "20000"
permissions:
  contents: read
jobs:
  confirm:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Independent confirmatory evaluation
        run: node scripts/confirm-v2.mjs ${{ github.event.inputs.games || '20000' }}
      - name: Save all paired game scores
        uses: actions/upload-artifact@v4
        with:
          name: win-dp-v2-confirmatory-results
          path: benchmarks/research/confirm-v2-*.json
          retention-days: 90
  qr_dqn_extended:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only PyTorch and numpy
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Train 30,000 episodes with independent seed and evaluate 5,000 episodes
        run: python training/qr_dqn_choice.py --episodes 30000 --eval 5000 --seed 26111
      - name: Preserve long-study model and results
        uses: actions/upload-artifact@v4
        with:
          name: yachtlab-qr-dqn-30k-choice
          path: |
            training/results/qr-dqn-choice.json
            training/checkpoints/qr-dqn-choice.pt
          retention-days: 90
