name: YachtLab independently trained YahtzeeRL checkpoint transfer diagnostic
on:
  pull_request:
    paths:
      - scripts/yahtzeerl-12-infer.py
      - scripts/benchmark-yahtzeerl-12-transfer.mjs
      - scripts/summarize-yahtzeerl-transfer.mjs
      - .github/workflows/yahtzeerl-transfer.yml
  push:
    branches: [main]
    paths:
      - scripts/yahtzeerl-12-infer.py
      - scripts/benchmark-yahtzeerl-12-transfer.mjs
      - scripts/summarize-yahtzeerl-transfer.mjs
      - .github/workflows/yahtzeerl-transfer.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: yachtlab-yahtzeerl-transfer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate independent transfer benchmark without downloading pretrained models
        run: |
          npm test -- --reporter=dot
          npm run build
          node --check scripts/benchmark-yahtzeerl-12-transfer.mjs
          node --check scripts/summarize-yahtzeerl-transfer.mjs
          python3 -m py_compile scripts/yahtzeerl-12-infer.py
  duel:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Download exact publicly available upstream source commit
        run: |
          git clone --depth 1 https://github.com/itxtx/yahtzeeRL.git "$RUNNER_TEMP/yahtzeerl"
          git -C "$RUNNER_TEMP/yahtzeerl" checkout 603644269dfbe638a082ca7d39317eb7ac2727fd
          echo "YAHTZEERL_PINNED_SOURCE=$(git -C "$RUNNER_TEMP/yahtzeerl" rev-parse HEAD)"
      - name: Install author's original JAX Flax Orbax model runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "$RUNNER_TEMP/yahtzeerl" "huggingface_hub[cli]"
      - name: Download real best competitive checkpoint (HF MIT; not committed to repository)
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          python -c 'import os; from huggingface_hub import snapshot_download; print(snapshot_download(repo_id="itxtx/yahtzee-rl-checkpoints",allow_patterns=["config.json","step_011800/**"],local_dir=os.path.join(os.environ["RUNNER_TEMP"],"yahtzeerl/checkpoints/win_loss_margin_32simsrun4")))'
          test -e "$RUNNER_TEMP/yahtzeerl/checkpoints/win_loss_margin_32simsrun4/config.json"
          test -d "$RUNNER_TEMP/yahtzeerl/checkpoints/win_loss_margin_32simsrun4/step_011800"
      - name: Real pretrained greedy policy head zero-shot transfer vs Win DP v2
        env:
          JAX_PLATFORMS: cpu
          XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
          YAHTZEERL_PYTHON: python
          YAHTZEERL_CHECKPOINT: ${{ runner.temp }}/yahtzeerl/checkpoints/win_loss_margin_32simsrun4/step_011800
        run: node scripts/benchmark-yahtzeerl-12-transfer.mjs --shard ${{ matrix.shard }} --pairs 40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yahtzeerl-transfer-shard-${{ matrix.shard }}
          path: training/results/yahtzeerl-transfer/shard-${{ matrix.shard }}.json
          retention-days: 90
          if-no-files-found: warn
  summarize:
    needs: duel
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: yahtzeerl-transfer-shard-*
          path: training/results/yahtzeerl-transfer
          merge-multiple: true
      - name: Analyze neural transfer, baseline losses and per-round defects
        run: node scripts/summarize-yahtzeerl-transfer.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: yahtzeerl-trained-external-final-report
          path: |
            docs/context/_generated/YAHTZEERL-TRANSFER-LATEST.md
            training/results/yahtzeerl-transfer/final-summary.json
          retention-days: 90
      - name: Publish only research report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/context/_generated/YAHTZEERL-TRANSFER-LATEST.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(research): publish authentic YahtzeeRL checkpoint transfer diagnostics [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
