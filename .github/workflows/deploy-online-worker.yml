name: Deploy YachtLab Online Worker (manual)
# CI-1.2 (D-100): the manual path for guarded releases (Worker config, Durable Object migrations, runtime vars,
# economy policy), for the first release after a rollback or a stopped automatic run, and for any operator
# release. Ordinary Worker changes are released by deploy-online-worker-auto.yml after the main pipeline.
# Every manual release waits for an operator approval in the worker-production-approval Environment.
on:
  workflow_dispatch:
    inputs:
      free_plan_confirmed:
        description: "I verified Workers Free and that paid billing is disabled."
        required: true
        type: boolean
        default: false
      reviewed_sha:
        description: "Full main SHA reviewed for this release."
        required: true
        type: string
      pages_build:
        description: "Live Pages version.json build reviewed for Worker compatibility."
        required: true
        type: string
      active_worker_version:
        description: "Live Worker version UUID at 100%, confirmed as the rollback target."
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: yachtlab-online-worker-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require an explicit release from main
        env:
          FREE_PLAN: ${{ inputs.free_plan_confirmed }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          PAGES_BUILD: ${{ inputs.pages_build }}
          EXPECTED_WORKER_VERSION: ${{ inputs.active_worker_version }}
        shell: bash
        run: |
          [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_RUN_ATTEMPT" == 1 && "$FREE_PLAN" == true ]] ||
            { echo 'Dispatch a new run against main with Workers Free confirmed.'; exit 1; }
          [[ "$REVIEWED_SHA" == "$GITHUB_SHA" ]] ||
            { echo 'The reviewed SHA must match the dispatched SHA.'; exit 1; }
          [[ "$PAGES_BUILD" =~ ^[0-9a-f]{7,40}-[0-9a-z]+$ &&
             "$EXPECTED_WORKER_VERSION" =~ ^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$ ]] ||
            { echo 'Supply a valid Pages build ID and active Worker UUID.'; exit 1; }
          printf '### Requested release\n\n- Commit: `%s`\n- Pages build: `%s`\n- Rollback version: `%s`\n' \
            "$REVIEWED_SHA" "$PAGES_BUILD" "$EXPECTED_WORKER_VERSION" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # SEC-1-04: the bundle the deploy job releases is built here, without Cloudflare credentials.
      - name: Build the Worker bundle and its manifest (no Cloudflare credentials)
        run: node scripts/ci/worker-artifact.mjs prepare "$RUNNER_TEMP/worker-release" "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: worker-release
          path: ${{ runner.temp }}/worker-release
          retention-days: 3
          if-no-files-found: error

  # D-100: manual releases are the high-risk path (economy policy, Durable Object migrations, bindings, runtime vars,
  # recovery after a rollback or a stopped automatic release). They keep a separate operator approval in an
  # Environment without secrets; the release itself still runs in worker-production with its dedicated token.
  approve:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.run_attempt == '1' && inputs.free_plan_confirmed
    environment: worker-production-approval
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: read
    steps:
      - name: Require a protected approval Environment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        # GitHub creates a missing Environment without protection, so check that this one really has reviewers.
        run: |
          rules=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/environments/worker-production-approval") ||
            { echo 'Could not read the approval Environment.'; exit 1; }
          echo "$rules" | jq -e '[.protection_rules[]? | select(.type == "required_reviewers" and ((.reviewers // []) | length) > 0)] | length > 0' > /dev/null ||
            { echo 'worker-production-approval has no required reviewers. Configure it before any manual release.'; exit 1; }
          echo "Approved by a required reviewer of worker-production-approval."

  deploy:
    needs: [verify, approve]
    if: github.ref == 'refs/heads/main' && github.run_attempt == '1' && inputs.free_plan_confirmed
    environment: worker-production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Emergency stop
        env:
          WORKER_DEPLOY_ENABLED: ${{ vars.WORKER_PRODUCTION_DEPLOY_ENABLED }}
        run: |
          test "$WORKER_DEPLOY_ENABLED" = true ||
            { echo 'Worker releases are stopped (WORKER_PRODUCTION_DEPLOY_ENABLED is not true). Follow the runbook.'; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Wrangler only: no install scripts and no build in the credentialed job (SEC-1-04).
      - name: Install the deploy tool without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: worker-release
          path: ${{ runner.temp }}/worker-release
      - name: Verify the prepared bundle
        id: bundle
        run: |
          node scripts/ci/worker-artifact.mjs verify "$RUNNER_TEMP/worker-release" "$GITHUB_SHA"
          echo "sha256=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).bundle.sha256)' "$RUNNER_TEMP/worker-release/release.json")" >> "$GITHUB_OUTPUT"
      - name: Release and record the existing yachtlab-online Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.WORKER_PRODUCTION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.WORKER_PRODUCTION_ACCOUNT_ID }}
          EXPECTED_WORKER_VERSION: ${{ inputs.active_worker_version }}
          PAGES_BUILD: ${{ inputs.pages_build }}
          WORKER_BUNDLE: ${{ runner.temp }}/worker-release/bundle/index.js
          WORKER_BUNDLE_SHA256: ${{ steps.bundle.outputs.sha256 }}
        run: node scripts/ci/deploy-online-worker.mjs
