name: Competitive research benchmark
on:
  workflow_dispatch:
    inputs:
      games:
        description: "Even number of games with swapped seats for each seed (2 to 100000)"
        required: true
        default: "2000"
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run Win DP versus DP Expert experiment
        # SEC-1-07: the free-text input reaches the shell only as a validated environment value.
        env:
          GAMES: ${{ inputs.games }}
        run: |
          if [ -n "$GAMES" ] && ! [[ "$GAMES" =~ ^[0-9]{1,6}$ ]]; then echo "games must be a number" >&2; exit 1; fi
          node scripts/research-competitive.mjs ${GAMES:+"$GAMES"}
      - name: Independent larger confirmatory run (20,000 games)
        if: github.event_name == 'push'
        run: node scripts/research-competitive.mjs 20000 930000
      - name: Save individual game scores
        uses: actions/upload-artifact@v4
        with:
          name: competitive-research-results
          path: benchmarks/research/*.json
          retention-days: 90
