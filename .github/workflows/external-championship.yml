name: YachtLab external-source strategy championship
on:
  pull_request:
    paths:
      - "src/external-challengers.ts"
      - "tests/external-challengers.test.ts"
      - "scripts/external-championship.mjs"
      - "scripts/summarize-external-championship.mjs"
      - ".github/workflows/external-championship.yml"
  push:
    branches: [main]
    paths:
      - "src/external-challengers.ts"
      - "tests/external-challengers.test.ts"
      - "scripts/external-championship.mjs"
      - "scripts/summarize-external-championship.mjs"
      - ".github/workflows/external-championship.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: yachtlab-external-strategies-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Regression tests, external rule ports and client build
        run: |
          npm test -- --reporter=dot
          npm run build
          node --check scripts/external-championship.mjs
          node --check scripts/summarize-external-championship.mjs
      - name: All four challenger roundtrip smoke games
        run: |
          for opponent in RustHeuristic12 RustOptimalEquivalent12 PanchtWeighted12 BenjiWinObjective12; do
            node scripts/external-championship.mjs --opponent "$opponent" --shard 0 --smoke
          done
  duel:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        opponent: [RustHeuristic12, RustOptimalEquivalent12, PanchtWeighted12, BenjiWinObjective12]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 250 independent paired seeds, two games with swapped seats
        run: node scripts/external-championship.mjs --opponent ${{ matrix.opponent }} --shard ${{ matrix.shard }} --pairs 250
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-duel-${{ matrix.opponent }}-${{ matrix.shard }}
          path: training/results/external-championship/${{ matrix.opponent }}-shard-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 90
  summarize:
    needs: duel
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # push ONLY the automation/research-* branch
      pull-requests: write # open / update the research report PR
      actions: write # start deploy.yml so the required ci-result exists on that PR (also reads artifacts)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: external-duel-*
          path: training/results/external-championship
          merge-multiple: true
      - name: Verify 8k matches and compute paired confidence intervals
        run: node scripts/summarize-external-championship.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: external-championship-final-report
          path: |
            training/results/external-championship/final-summary.json
            docs/context/_generated/EXTERNAL-CHAMPIONSHIP-LATEST.md
          retention-days: 90
      - name: Commit only research results, no default AI changes
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          node scripts/ci/publish-generated.mjs publish \
            --branch automation/research-external-championship \
            --allow "docs/context/_generated/EXTERNAL-CHAMPIONSHIP-LATEST.md" \
            --scope-to-allow --preserve-history \
            --title "chore(research): publish external strategy adaptation tournament results" \
            --note "연구 워크플로가 생성한 보고서입니다. 알고리즘·실험 설정·시드·결과는 바꾸지 않고 문서만 추가/갱신합니다. 원본 실행과 아티팩트: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Start the required CI on the research report PR
        if: steps.publish.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.publish.outputs.head_sha }}
        run: node scripts/ci/publish-generated.mjs ensure-ci --branch automation/research-external-championship --sha "$HEAD_SHA" --workflow deploy.yml
