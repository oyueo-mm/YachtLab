name: Test and deploy YachtLab
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Hosted Ubuntu already provides Chromium's required shared libraries.
      # Avoid downloading unrelated OS fonts on every deployment.
      - name: Install headless Chromium
        timeout-minutes: 5
        run: npx playwright install --only-shell chromium
      - name: Browser checks
        run: |
          npm run preview -- --port 5173 > /tmp/yachtlab-vite.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5173/YachtLab/ > /dev/null && break; sleep 1; done
          npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
