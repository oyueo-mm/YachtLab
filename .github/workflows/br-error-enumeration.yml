name: YachtLab exhaustive exact last-turn WinDP error enumeration
on:
  pull_request:
    paths:
      - "scripts/enumerate-br-lastturn.mjs"
      - "scripts/summarize-br-enumeration.mjs"
      - ".github/workflows/br-error-enumeration.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: yachtlab-exact-lastturn-enum-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          npm test -- --reporter=dot
          npm run build
          node --check scripts/enumerate-br-lastturn.mjs
          node --check scripts/summarize-br-enumeration.mjs
      - name: Smoke exact 252-dice enumeration on genuine self-play scorecards
        run: node scripts/enumerate-br-lastturn.mjs --shard 0 --smoke
  enumerate:
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate 100 real game boards and evaluate all 252 rolled dice per board
        run: node scripts/enumerate-br-lastturn.mjs --shard ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: br-exact-enumeration-${{ matrix.shard }}
          path: training/results/br-enumeration/shard-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 90
  summarize:
    needs: enumerate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # push ONLY the automation/research-* branch
      pull-requests: write # open / update the research report PR
      actions: write # start deploy.yml so the required ci-result exists on that PR (also reads artifacts)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: br-exact-enumeration-*
          path: training/results/br-enumeration
          merge-multiple: true
      - name: Full probability-weighted exact witness audit and game-clustered CI
        run: node scripts/summarize-br-enumeration.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: br-exact-enumeration-final-summary
          path: |
            docs/context/_generated/BR-ERRORS-LATEST.md
            training/results/br-enumeration/summary.json
          retention-days: 90
      - name: Persist research evidence, no app policy modification
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          node scripts/ci/publish-generated.mjs publish \
            --branch automation/research-br-error-enumeration \
            --allow "docs/context/_generated/BR-ERRORS-LATEST.md" \
            --scope-to-allow --preserve-history \
            --title "chore(research): exhaustive last-turn WinDP policy error audit" \
            --note "연구 워크플로가 생성한 보고서입니다. 알고리즘·실험 설정·시드·결과는 바꾸지 않고 문서만 추가/갱신합니다. 원본 실행과 아티팩트: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Start the required CI on the research report PR
        if: steps.publish.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.publish.outputs.head_sha }}
        run: node scripts/ci/publish-generated.mjs ensure-ci --branch automation/research-br-error-enumeration --sha "$HEAD_SHA" --workflow deploy.yml
