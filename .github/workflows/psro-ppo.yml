name: YachtLab PSRO + adaptive opponents + empirical PMF + full-game PPO
on:
  pull_request:
    paths:
      - "src/psro-meta.ts"
      - "src/ppo-surrogate.ts"
      - "src/neural-residual.ts"
      - "src/competitive-v3.ts"
      - "scripts/research-psro.mjs"
      - "scripts/research-opponent-pmf.mjs"
      - "scripts/train-ppo-psro.mjs"
      - "tests/psro-meta.test.ts"
      - "tests/ppo-surrogate.test.ts"
      - ".github/workflows/psro-ppo.yml"
  push:
    branches: [main]
    paths:
      - "src/psro-meta.ts"
      - "src/ppo-surrogate.ts"
      - "src/neural-residual.ts"
      - "src/competitive-v3.ts"
      - "scripts/research-psro.mjs"
      - "scripts/research-opponent-pmf.mjs"
      - "scripts/train-ppo-psro.mjs"
      - ".github/workflows/psro-ppo.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: yachtlab-psro-ppo-${{ github.ref }}
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: write # push ONLY the automation/research-* branch
      pull-requests: write # open / update the research report PR
      actions: write # start deploy.yml so the required ci-result exists on that PR (also reads artifacts)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate JavaScript syntax and mathematical unit tests
        run: |
          node --check scripts/research-psro.mjs
          node --check scripts/research-opponent-pmf.mjs
          node --check scripts/train-ppo-psro.mjs
          npm test -- --reporter=dot
      - name: Simulate PSRO best-response oracle and restricted-game Nash meta-solver
        run: node scripts/research-psro.mjs ${{ github.event_name == 'pull_request' && '--smoke' || '' }}
      - name: Archive PSRO matrix, meta-strategy and adaptive snapshots
        uses: actions/upload-artifact@v4
        with:
          name: psro-matrix-and-adaptive-oracles
          path: |
            training/results/psro-real-matrix.json
            training/results/psro-population.json
            docs/context/_generated/PSRO-LATEST.md
          retention-days: 90
      - name: Validate discrete opponent residual score PMF against Gaussian and play Win DP v3
        run: node scripts/research-opponent-pmf.mjs ${{ github.event_name == 'pull_request' && '--smoke' || '' }}
      - name: Archive full probabilistic opponent score forecasts and independent held-out evidence
        uses: actions/upload-artifact@v4
        with:
          name: opponent-empirical-pmf
          path: |
            training/results/opponent-empirical-pmf.json
            docs/context/_generated/PMF-LATEST.md
          retention-days: 90
      - name: Train genuine full-game PPO + PPO with DP teacher KL against PSRO mixture
        run: node scripts/train-ppo-psro.mjs ${{ github.event_name == 'pull_request' && '--smoke' || '' }}
      - name: Archive PPO checkpoints, frozen log probabilities, training and independent matches
        uses: actions/upload-artifact@v4
        with:
          name: ppo-full-game-models-and-raw
          path: |
            training/results/ppo-full-game.json
            training/checkpoints/ppo-selected.json
            docs/context/_generated/PPO-LATEST.md
          retention-days: 90
      - name: Persist independently measured research results to GitHub context hub
        id: publish
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          node scripts/ci/publish-generated.mjs publish \
            --branch automation/research-psro-ppo \
            --allow "docs/context/_generated/PSRO-LATEST.md" \
            --allow "docs/context/_generated/PMF-LATEST.md" \
            --allow "docs/context/_generated/PPO-LATEST.md" \
            --scope-to-allow --preserve-history \
            --title "chore(context): record PSRO-PMF-PPO real experiments" \
            --note "연구 워크플로가 생성한 보고서입니다. 알고리즘·실험 설정·시드·결과는 바꾸지 않고 문서만 추가/갱신합니다. 원본 실행과 아티팩트: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Start the required CI on the research report PR
        if: github.event_name != 'pull_request' && steps.publish.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.publish.outputs.head_sha }}
        run: node scripts/ci/publish-generated.mjs ensure-ci --branch automation/research-psro-ppo --sha "$HEAD_SHA" --workflow deploy.yml
