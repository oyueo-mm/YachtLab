name: Full-game neural self-play — REINFORCE and Monte Carlo Actor-Critic
on:
  pull_request:
    paths:
      - "src/neural-residual.ts"
      - "scripts/train-neural-selfplay.mjs"
      - "tests/neural-selfplay.test.ts"
      - ".github/workflows/neural-selfplay.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neural-selfplay-${{ github.ref }}
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check JavaScript harness syntax
        run: node --check scripts/train-neural-selfplay.mjs
      - name: Smoke train both full-game neural methods in PR
        if: github.event_name == 'pull_request'
        run: node scripts/train-neural-selfplay.mjs --smoke
      - name: Train and evaluate both neural methods in actual full games
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/train-neural-selfplay.mjs
      - name: Archive learned network weights and all individual match records
        uses: actions/upload-artifact@v4
        with:
          name: full-game-neural-selfplay
          path: |
            training/results/neural-full-selfplay.json
            training/checkpoints/neural-full-selfplay-chosen.json
            docs/context/_generated/NEURAL-SELFPLAY-LATEST.md
          retention-days: 90
      - name: Keep the report file(s) for the publish job
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: research-report-neural-selfplay
          path: |
            docs/context/_generated/NEURAL-SELFPLAY-LATEST.md
          retention-days: 90
          if-no-files-found: ignore
  publish-report:
    needs: train
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # push ONLY the automation/research-* branch
      pull-requests: write # open / update the research report PR
      actions: write # start deploy.yml so the required ci-result exists on that PR
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch the report file(s) produced by train
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: research-report-neural-selfplay
          path: docs/context/_generated
      - name: Persist scientific summary in GitHub context hub
        id: publish
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          node scripts/ci/publish-generated.mjs publish \
            --branch automation/research-neural-selfplay \
            --allow "docs/context/_generated/NEURAL-SELFPLAY-LATEST.md" \
            --scope-to-allow --preserve-history \
            --title "chore(context): save full-game neural self-play report" \
            --note "연구 워크플로가 생성한 보고서입니다. 알고리즘·실험 설정·시드·결과는 바꾸지 않고 문서만 추가/갱신합니다. 원본 실행과 아티팩트: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Start the required CI on the research report PR
        if: github.event_name == 'workflow_dispatch' && steps.publish.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.publish.outputs.head_sha }}
        run: node scripts/ci/publish-generated.mjs ensure-ci --branch automation/research-neural-selfplay --sha "$HEAD_SHA" --workflow deploy.yml
