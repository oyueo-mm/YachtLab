name: YachtLab Win DP v3.1 research and independent confirmation
on:
  pull_request:
    paths:
      - src/research-v31.ts
      - tests/research-v31.test.ts
      - scripts/bench-v31.mjs
      - scripts/summarize-v31.mjs
      - .github/workflows/v31-research.yml
  push:
    branches: [main]
    paths:
      - src/research-v31.ts
      - tests/research-v31.test.ts
      - scripts/bench-v31.mjs
      - scripts/summarize-v31.mjs
      - .github/workflows/v31-research.yml
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 0"
permissions:
  contents: read
concurrency:
  group: yachtlab-v31-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Full unit tests, typecheck, and production build
        run: |
          npm test -- --reporter=dot
          npm run build
          node --check scripts/bench-v31.mjs
          node --check scripts/summarize-v31.mjs
      - name: Seat-swapped full-game smoke checks
        run: |
          node scripts/bench-v31.mjs --candidate v31-hybrid --opponent "Win DP v2" --shard 1 --smoke
          node scripts/bench-v31.mjs --candidate v31-hybrid --opponent "Win DP v3" --shard 1 --smoke
          node scripts/bench-v31.mjs --candidate v31-hybrid --opponent "DP Expert" --shard 1 --smoke
          node scripts/bench-v31.mjs --candidate v3-unmodified --opponent "Win DP v2" --shard 1 --smoke
  duel:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - candidate: v31-hybrid
            opponent: Win DP v2
            pairs: 1000
          - candidate: v3-unmodified
            opponent: Win DP v2
            pairs: 1000
          - candidate: v31-hybrid
            opponent: Win DP v3
            pairs: 1000
          - candidate: v31-hybrid
            opponent: DP Expert
            pairs: 500
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fresh independent seat-swapped match pairs
        run: |
          shard=3
          if [[ "${{ github.event_name }}" == "schedule" ]]; then shard=$((${{ github.run_number }} + 100)); fi
          node scripts/bench-v31.mjs --candidate "${{ matrix.candidate }}" --opponent "${{ matrix.opponent }}" --shard "$shard" --pairs "${{ matrix.pairs }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v31-confirm-${{ matrix.candidate }}-${{ matrix.opponent }}
          path: training/results/v31-challenge/*.json
          retention-days: 90
          if-no-files-found: warn
  summarize:
    needs: duel
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # push ONLY the automation/research-* branch
      pull-requests: write # open / update the research report PR
      actions: write # start deploy.yml so the required ci-result exists on that PR (also reads artifacts)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: v31-confirm-*
          path: training/results/v31-challenge
          merge-multiple: true
      - name: Independently summarize the preregistered four scenarios
        run: |
          shard=3
          if [[ "${{ github.event_name }}" == "schedule" ]]; then shard=$((${{ github.run_number }} + 100)); fi
          node scripts/summarize-v31.mjs --shard "$shard"
      - uses: actions/upload-artifact@v4
        with:
          name: v31-independent-report
          path: |
            training/results/v31-challenge/independent-confirmation.json
            docs/context/_generated/V31-LATEST.md
          retention-days: 90
      - name: Commit research-only summary without promoting AI
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          node scripts/ci/publish-generated.mjs publish \
            --branch automation/research-v31-research \
            --allow "docs/context/_generated/V31-LATEST.md" \
            --scope-to-allow --preserve-history \
            --title "chore(research): publish Win DP v3.1 fresh-shard evidence" \
            --note "연구 워크플로가 생성한 보고서입니다. 알고리즘·실험 설정·시드·결과는 바꾸지 않고 문서만 추가/갱신합니다. 원본 실행과 아티팩트: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Start the required CI on the research report PR
        if: steps.publish.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.publish.outputs.head_sha }}
        run: node scripts/ci/publish-generated.mjs ensure-ci --branch automation/research-v31-research --sha "$HEAD_SHA" --workflow deploy.yml
