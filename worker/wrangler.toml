# YachtLab Online — Cloudflare Workers + SQLite-backed Durable Objects.
# Production values below (Workers Free). Local development overrides them with --var
# (`npm run online:worker`, tests/helpers/wrangler.ts). See docs/online/ONLINE-V01-PHASE4.md.
name = "yachtlab-online"
main = "src/index.ts"
compatibility_date = "2026-11-01"
# Public address: https://yachtlab-online.<account subdomain>.workers.dev (free). No custom routes.
workers_dev = true
preview_urls = false


# Keep application error codes. Suppress request/response invocation records and redact URL queries
# in observability metadata. Verify the effective collection and exports after an approved deploy.
[observability]
enabled = true
redact_query_string = true

[observability.logs]
enabled = true
invocation_logs = false

[observability.traces]
enabled = false

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "YachtRoom"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "RoomDirectory"

# Phase 4 accounts: one SQLite object per account, one per linked guest id (same Worker, no new
# account resource; still Workers Free). Sign-in stays OFF until the secrets below exist.
[[durable_objects.bindings]]
name = "USERS"
class_name = "UserStore"

[[durable_objects.bindings]]
name = "GUESTS"
class_name = "GuestLink"

# Phase 4.5: one global object — quick-match queue (hibernatable sockets), public spectating list,
# operations counters. Same Worker, SQLite-backed (Workers Free), no new account resource.
[[durable_objects.bindings]]
name = "HUB"
class_name = "MatchHub"

[[durable_objects.bindings]]
name = "FRIENDS"
class_name = "FriendIndex"

# ADMIN-1 / FEEDBACK-1: one global admin object (sessions, audit, member index, campaigns, codes, notices,
# reports, sanctions) and one suggestion board. Same Worker, SQLite-backed (Workers Free). Both stay
# inert until the owner sets the ADMIN_ACCOUNTS secret / FEEDBACK_BOARD var (docs/admin/ADMIN-FEEDBACK.md).
[[durable_objects.bindings]]
name = "ADMIN"
class_name = "AdminHub"

[[durable_objects.bindings]]
name = "FEEDBACK"
class_name = "SuggestionBoard"

# LIVE-1 (오늘의 요트): one small SQLite object per (rules, KST date) — first official results and counters.
[[durable_objects.bindings]]
name = "DAILY_BOARDS"
class_name = "DailyBoard"

# Workers Free supports only SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["YachtRoom", "RoomDirectory"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["UserStore", "GuestLink"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["MatchHub"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["FriendIndex"]

# ADMIN-1 / FEEDBACK-1 — final tag fixed by INT-1 (production has v1–v4). v6 is LIVE-1 (DailyBoard).
# Migrations apply in file order and an applied tag can never be renamed or removed.
[[migrations]]
tag = "v5"
new_sqlite_classes = ["AdminHub", "SuggestionBoard"]

# LIVE-1 (DailyBoard) — final tag fixed by INT-1: v6, after ADMIN-1's v5.
[[migrations]]
tag = "v6"
new_sqlite_classes = ["DailyBoard"]

[vars]
# Only the GitHub Pages site may call this server (browsers always send Origin).
ALLOWED_ORIGINS = "https://oyueo-mm.github.io"
TURN_TIMEOUT_MS = "120000"
# The account's free daily usage is shared with other Workers: keep this service well inside it.
MAX_ROOMS = "50"
DAILY_ROOM_LIMIT = "300"
# Server AI matches per day: a sub-budget of DAILY_ROOM_LIMIT (quick and invite matches keep the rest).
DAILY_AI_LIMIT = "100"
# Phase 5/6: official coins / gems / quests / achievements / shop (M3i-W30). "off" stops all grants
# and purchases at once (balances are kept). Rewards only from server-verified matches of members.
ECONOMY = "on"
# LIVE-1 오늘의 요트 / 오늘의 퍼즐: "off" until the operator sets the DAILY_SECRET Worker secret (>= 32 chars)
# and turns it on (docs/context/DAILY-LIVE-1.md). Off = every /api/daily route answers 404 DAILY_OFF.
# DAILY_SECRET / DAILY_SECRET_PREVIOUS are Worker SECRETS (never here); DAILY_SECRET_FROM is set only
# while rotating (dated rotation, see docs §2.5).
DAILY = "off"
DAILY_PARTICIPANT_LIMIT = "500"
DAILY_PRACTICE_PER_DAY = "5"
DICE_DRAW = "on"
# ADMIN-1: admin writes (rewards, codes, sanctions, notices) OFF; approvals need a second administrator.
# Administrators themselves are the Worker SECRET `ADMIN_ACCOUNTS` (never in this file). FEEDBACK-1 board off.
ADMIN_WRITES = "off"
ADMIN_APPROVAL = "two-person"
FEEDBACK_BOARD = "off"
CREATE_PER_MINUTE = "5"
JOIN_PER_MINUTE = "30"
LOBBY_IDLE_MS = "1800000"
FINISHED_IDLE_MS = "1800000"
PLAYING_IDLE_MS = "86400000"
ROOM_MAX_AGE_MS = "172800000"
# Where the sign-in flow returns to (the Pages site). Sign-in additionally needs three Worker secrets,
# set by the owner in the Cloudflare dashboard (never in this file): GOOGLE_CLIENT_ID,
# GOOGLE_CLIENT_SECRET, AUTH_SECRET (>= 32 random characters). See docs/online/SOCIAL-AND-ACCOUNTS.md.
APP_URL = "https://oyueo-mm.github.io/YachtLab/"
