# YachtLab Online — Cloudflare Workers + SQLite-backed Durable Objects (Phase 3).
# Local only for now: `npm run online:worker` (wrangler dev --local). Nothing here has been deployed;
# see docs/online/ONLINE-V01-PHASE3.md before any `wrangler deploy`.
name = "yachtlab-online"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = false
preview_urls = false


[observability]
enabled = false

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "YachtRoom"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "RoomDirectory"

# Workers Free supports only SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["YachtRoom", "RoomDirectory"]

[vars]
ALLOWED_ORIGINS = "http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:4173,http://localhost:4173"
TURN_TIMEOUT_MS = "120000"
MAX_ROOMS = "200"
CREATE_PER_MINUTE = "10"
JOIN_PER_MINUTE = "30"
LOBBY_IDLE_MS = "1800000"
FINISHED_IDLE_MS = "1800000"
PLAYING_IDLE_MS = "86400000"
ROOM_MAX_AGE_MS = "172800000"
